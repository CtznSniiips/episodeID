<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpisodeID</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
<script>
  // Apply the saved theme before the page draws, so there's no flash of the wrong one.
  try { const t = localStorage.getItem("episodeid-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><img id="brand-icon" src="/static/icon.svg" alt=""> EpisodeID</a>
  <nav>
    <a href="#/" data-nav="series">Series</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div id="chips" class="chips"></div>
  <button id="theme-btn" class="theme-btn" type="button" aria-label="Theme"></button>
</header>
<main id="view"></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
